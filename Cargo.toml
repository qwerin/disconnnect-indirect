[package]
name = "connect-direct"
version = "0.3.1"
edition = "2021"
rust-version = "1.88"
description = "Async Rust klient pro IBM Sterling Connect:Direct Web Services (CDWS) REST API"
license = "MIT"
readme = "README.md"
repository = "https://github.com/qwerin/disconnnect-indirect"
keywords = ["connect-direct", "ibm", "sterling", "file-transfer", "mft"]
categories = ["api-bindings", "command-line-utilities", "network-programming"]

[lib]
name = "connect_direct"
path = "src/lib.rs"

[[bin]]
name = "cdctl"
path = "src/bin/cdctl/main.rs"
required-features = ["cli"]

[features]
default = ["cli"]
cli = [
    "dep:clap",
    "dep:toml",
    "dep:tracing-subscriber",
    "dep:tracing-appender",
    "tokio/macros",
    "tokio/rt-multi-thread",
]

[dependencies]
reqwest = { version = "0.13", default-features = false, features = ["json", "query", "cookies", "rustls"] }
tokio = { version = "1", features = ["sync", "time"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
base64 = "0.23"
thiserror = "2"
tracing = "0.1"
clap = { version = "4", features = ["derive", "env"], optional = true }
toml = { version = "1", optional = true }
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"], optional = true }
tracing-appender = { version = "0.2", optional = true }

[dev-dependencies]
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
wiremock = "0.6"
assert_cmd = "2"
predicates = "3"
rcgen = { version = "0.14", default-features = false, features = ["aws_lc_rs", "pem"] }
tempfile = "3"
proptest = "1"

[[test]]
name = "client"
path = "tests/client.rs"

[[test]]
name = "cli"
path = "tests/cli.rs"
required-features = ["cli"]

[profile.release]
lto = true
codegen-units = 1
strip = true
