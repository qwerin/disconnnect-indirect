name: Release

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  TARGET: x86_64-unknown-linux-musl

jobs:
  build-linux-amd64:
    name: build cdctl (linux amd64, static)
    runs-on: ubuntu-latest
    outputs:
      archive: ${{ steps.package.outputs.archive }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master 2026-10-16
        with:
          toolchain: stable
          targets: ${{ env.TARGET }}

      - name: install musl toolchain
        run: sudo apt-get update && sudo apt-get install -y musl-tools

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          key: ${{ env.TARGET }}

      - name: check tag matches Cargo.toml version
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          CRATE_VERSION=$(cargo metadata --no-deps --format-version 1 | jq -r '.packages[0].version')
          if [ "v${CRATE_VERSION}" != "${GITHUB_REF_NAME}" ]; then
            echo "::error::Tag ${GITHUB_REF_NAME} does not match Cargo.toml version ${CRATE_VERSION}"
            exit 1
          fi
          python3 scripts/changelog.py section "${GITHUB_REF_NAME}" > /dev/null \
            || { echo "::error::CHANGELOG.md has no section for ${GITHUB_REF_NAME}"; exit 1; }

      - name: build release binary
        run: cargo build --release --locked --target "$TARGET" --bin cdctl

      - name: verify binary is static and runs
        run: |
          BIN="target/$TARGET/release/cdctl"
          file "$BIN"
          file "$BIN" | grep -Eq 'statically linked|static-pie linked'
          "$BIN" --version
          "$BIN" send --snode SMOKE --from /a --to /b --dry-run | grep -q '^PEND$'

      - name: third-party licenses
        run: python3 scripts/third_party_licenses.py --target "$TARGET" -o THIRD-PARTY-LICENSES.txt

      - name: package
        id: package
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            ARCHIVE="cdctl-${TARGET}.tar.gz"
          else
            ARCHIVE="cdctl-${GITHUB_SHA::7}-${TARGET}.tar.gz"
          fi
          mkdir -p staging dist
          cp "target/$TARGET/release/cdctl" README.md LICENSE THIRD-PARTY-LICENSES.txt config.example.toml staging/
          tar -C staging -czf "dist/$ARCHIVE" cdctl README.md LICENSE THIRD-PARTY-LICENSES.txt config.example.toml
          (cd dist && sha256sum "$ARCHIVE" > "$ARCHIVE.sha256")
          cat "dist/$ARCHIVE.sha256"
          echo "archive=$ARCHIVE" >> "$GITHUB_OUTPUT"
          {
            echo "### cdctl linux amd64"
            echo '```'
            cat "dist/$ARCHIVE.sha256"
            ls -lh "dist/$ARCHIVE"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: cdctl-linux-amd64
          path: dist/*
          if-no-files-found: error

  github-release:
    name: publish GitHub release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build-linux-amd64
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0 # tagy kvůli odkazu na předchozí verzi
      - name: release notes from CHANGELOG.md
        run: |
          python3 scripts/changelog.py section "${GITHUB_REF_NAME}" > release-notes.md
          PREV=$(git tag --sort=-v:refname | grep -A1 -x "${GITHUB_REF_NAME}" | tail -n +2 || true)
          if [ -n "$PREV" ]; then
            printf '\n**Všechny změny:** %s/compare/%s...%s\n' "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY" "$PREV" "$GITHUB_REF_NAME" >> release-notes.md
          fi
          cat release-notes.md
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: cdctl-linux-amd64
          path: dist
      - uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          files: dist/*
          body_path: release-notes.md
          fail_on_unmatched_files: true
