# Automatické PR s aktualizacemi závislostí (Rust crates i GitHub Actions připnuté na SHA).
version: 2
updates:
  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 10
    groups:
      # drobné a opravné verze v jednom PR, hlavní verze zvlášť
      rust-minor-patch:
        update-types: [minor, patch]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    groups:
      actions:
        patterns: ["*"]
