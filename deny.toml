# Pravidla pro závislosti – kontroluje `cargo deny check` (lokálně i v CI).
# https://embarkstudios.github.io/cargo-deny/

[graph]
all-features = true

[advisories]
# Bezpečnostní hlášení i neudržované / stažené (yanked) crates jsou chyba.
unmaintained = "all"
yanked = "deny"
ignore = []

[licenses]
# Jen permisivní licence slučitelné s distribucí statické binárky pod MIT.
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-3-Clause",
    "ISC",
    "Unicode-3.0",
    "CDLA-Permissive-2.0",
]
confidence-threshold = 0.9

[bans]
# Více verzí téhož crate = varování (bloat), ne chyba – řeší se aktualizací upstreamu.
multiple-versions = "warn"
wildcards = "deny"
highlight = "all"
# Nechceme OpenSSL ani jiné nativní TLS knihovny – celé TLS je čistý Rust (rustls).
deny = [
    { crate = "openssl", reason = "TLS má být jen přes rustls" },
    { crate = "openssl-sys", reason = "TLS má být jen přes rustls" },
    { crate = "native-tls", reason = "TLS má být jen přes rustls" },
]

[sources]
# Jen oficiální crates.io, žádné git závislosti ani cizí registry.
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []
